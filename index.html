<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#8d4dff" />
    <meta name="description" content="ErrandGo — post any errand, find someone to help, and get things done anywhere." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='25' fill='%238d4dff'/%3E%3Ctext x='50' y='68' font-size='62' text-anchor='middle' fill='white' font-family='Arial' font-weight='800'%3EE%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./src/ui-polish.css" />
    <link rel="stylesheet" href="./withdraw-polish.css" />
    <link rel="stylesheet" href="./errandgo-states.css" />
    <link rel="stylesheet" href="./errandgo-final-polish.css" />
    <link rel="stylesheet" href="./errandgo-whatsapp-chat.css" />
    <link rel="stylesheet" href="./errandgo-3d-states.css" />
    <link rel="stylesheet" href="./errandgo-contextual-3d.css?v=4" />
    <title>ErrandGo — Get Things Done. Anywhere.</title>
    <style>
      .loading{display:none!important}.chatBox:not(:has(.bubble))+.chatForm{display:none!important}.chatBox:not(:has(.bubble)){min-height:330px;display:flex;align-items:center;justify-content:center}.chatBox:not(:has(.bubble)) .infoCard{width:100%;margin:0;background:#fbf9ff;border-color:#e8e0f5;border-radius:20px;padding:28px 20px;text-align:center}.chatBox:not(:has(.bubble)) .infoCard svg{width:38px;height:38px;color:#8d4dff;margin-bottom:8px}.chatBox:not(:has(.bubble)) .infoCard p{margin:7px 0 0;font-size:11px;line-height:1.5;color:#77717f}
      .eg-contextual-3d::before,.eg-contextual-3d::after,.taskList>.infoCard.eg-contextual-3d::before,.taskList>.infoCard.eg-contextual-3d::after{content:none!important;display:none!important}
      .eg-force-scene{width:86px;height:86px;margin:0 auto 16px;display:grid;place-items:center;position:relative;perspective:700px;transform-style:preserve-3d;animation:eg-force-float 3.8s ease-in-out infinite}.eg-force-scene>*{transform-style:preserve-3d}
      .eg-force-chat .eg-orb{width:58px;height:48px;border-radius:20px 20px 20px 8px;background:linear-gradient(145deg,#b978ff,#7d43ef);box-shadow:10px 12px 0 rgba(83,42,145,.18),0 18px 28px rgba(83,42,145,.22);transform:rotateX(10deg) rotateY(-18deg);position:relative}.eg-force-chat .eg-orb:after{content:'';position:absolute;right:7px;bottom:-7px;border-width:9px 0 0 12px;border-style:solid;border-color:transparent transparent transparent #7040d5;transform:rotate(-8deg)}.eg-force-chat .eg-orb:before{content:'•••';letter-spacing:4px;position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:16px;font-weight:900;transform:translateY(-2px)}
      .eg-force-bell .eg-orb{width:48px;height:52px;border-radius:26px 26px 12px 12px;background:linear-gradient(145deg,#b978ff,#7d43ef);box-shadow:9px 12px 0 rgba(83,42,145,.18),0 18px 28px rgba(83,42,145,.22);transform:rotateX(8deg) rotateY(-16deg);position:relative}.eg-force-bell .eg-orb:after{content:'';position:absolute;left:17px;bottom:-9px;width:15px;height:8px;border-radius:50%;background:#6e3bd0}
      .eg-force-wallet .eg-orb{width:62px;height:44px;border-radius:10px;background:linear-gradient(145deg,#9d61ff,#7137dc);box-shadow:10px 12px 0 rgba(83,42,145,.18),0 18px 28px rgba(83,42,145,.22);transform:rotateX(9deg) rotateY(-17deg);position:relative}.eg-force-wallet .eg-orb:after{content:'₦';position:absolute;right:-5px;top:12px;width:25px;height:18px;border-radius:6px;background:#baff19;color:#243000;font-weight:900;display:grid;place-items:center;box-shadow:2px 3px 0 rgba(0,0,0,.12)}
      .eg-force-star .eg-orb,.eg-force-heart .eg-orb{font-size:54px;font-weight:900;line-height:1;filter:drop-shadow(9px 11px 0 rgba(83,42,145,.16)) drop-shadow(0 15px 20px rgba(83,42,145,.18));transform:rotateX(12deg) rotateY(-18deg)}.eg-force-star .eg-orb{color:#9b5cff}.eg-force-heart .eg-orb{color:#9b5cff}
      .eg-force-package .eg-orb{width:54px;height:50px;background:linear-gradient(145deg,#c18aff,#7841dc);box-shadow:9px 12px 0 rgba(83,42,145,.18),0 18px 28px rgba(83,42,145,.22);transform:rotateX(10deg) rotateY(-18deg);position:relative}.eg-force-package .eg-orb:before{content:'';position:absolute;left:50%;top:0;width:3px;height:100%;background:#d9bdff;transform:translateX(-50%)}.eg-force-package .eg-orb:after{content:'';position:absolute;left:13px;top:8px;width:28px;height:3px;background:#d9bdff;transform:rotate(28deg)}
      .eg-force-globe .eg-orb{width:58px;height:58px;border-radius:50%;border:4px solid #8d4dff;box-shadow:inset -9px -7px 0 rgba(141,77,255,.12),8px 12px 0 rgba(83,42,145,.12),0 18px 28px rgba(83,42,145,.18);transform:rotateX(12deg) rotateY(-18deg);position:relative;animation:eg-force-spin 4.5s linear infinite}.eg-force-globe .eg-orb:before{content:'';position:absolute;left:12px;right:12px;top:25px;height:4px;border-radius:50%;background:#8d4dff;box-shadow:0 -13px 0 -1px rgba(141,77,255,.7),0 13px 0 -1px rgba(141,77,255,.7)}
      .eg-force-lock .eg-orb{width:48px;height:40px;border-radius:9px;background:linear-gradient(145deg,#a96aff,#7137dc);box-shadow:9px 12px 0 rgba(83,42,145,.18),0 18px 28px rgba(83,42,145,.22);transform:rotateX(10deg) rotateY(-17deg);position:relative;margin-top:15px}.eg-force-lock .eg-orb:before{content:'';position:absolute;width:27px;height:27px;border:6px solid #8d4dff;border-bottom:0;border-radius:20px 20px 0 0;left:4px;top:-25px}
      .eg-force-check .eg-orb{width:58px;height:58px;border-radius:50%;background:linear-gradient(145deg,#baff19,#72d900);color:#223000;font-size:42px;font-weight:1000;display:grid;place-items:center;box-shadow:9px 12px 0 rgba(83,42,145,.14),0 18px 28px rgba(83,42,145,.18);transform:rotateX(12deg) rotateY(-18deg)}.eg-force-repair .eg-orb{font-size:54px;color:#8d4dff;filter:drop-shadow(9px 11px 0 rgba(83,42,145,.16));transform:rotateX(12deg) rotateY(-18deg)}
      @keyframes eg-force-float{0%,100%{transform:translateY(0) rotateZ(-1deg)}50%{transform:translateY(-8px) rotateZ(1deg)}}@keyframes eg-force-spin{from{transform:rotateY(0) rotateX(12deg)}to{transform:rotateY(360deg) rotateX(12deg)}}@media(prefers-reduced-motion:reduce){.eg-force-scene,.eg-force-globe .eg-orb{animation:none}}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>try{const old=JSON.parse(localStorage.getItem('eg_chat')||'[]');if(Array.isArray(old)&&old.some(m=>!m.conversation_id))localStorage.removeItem('eg_chat')}catch(_){localStorage.removeItem('eg_chat')}</script>
    <script src="./errandgo-contextual-3d.js?v=4"></script>
    <script type="module" src="./src/main.jsx"></script>
    <script type="module" src="./src/reviews-enhancer.js?v=1"></script>
    <script>
      (()=>{const map=t=>{t=t.toLowerCase();if(/chat|message|conversation/.test(t))return'chat';if(/notification|caught up/.test(t))return'bell';if(/wallet|money|fund|balance|withdraw/.test(t))return'wallet';if(/rating|review/.test(t))return'star';if(/saved/.test(t))return'heart';if(/internet|offline|connection/.test(t))return'globe';if(/sign in|login|account|authentication|register|sign up/.test(t))return'lock';if(/success|successful|completed|complete/.test(t))return'check';if(/error|failed|failure|something went wrong/.test(t))return'repair';if(/errand|task|application/.test(t))return'package';return null};const scan=()=>document.querySelectorAll('.infoCard,.emptyState,.eg-empty-state').forEach(el=>{const svg=el.querySelector('svg');if(!svg)return;const type=map((document.querySelector('h1,h2,h3,[role="heading"]')?.textContent||'')+' '+(el.textContent||''));if(!type)return;el.classList.add('eg-contextual-3d');if(!el.querySelector('.eg-force-scene')){const scene=document.createElement('div');scene.className='eg-force-scene eg-force-'+type;scene.setAttribute('aria-hidden','true');const orb=document.createElement('div');orb.className='eg-orb';orb.textContent=type==='star'?'★':type==='heart'?'♥':type==='check'?'✓':type==='repair'?'⚒':'';scene.appendChild(orb);el.insertBefore(scene,el.firstChild)}svg.remove()});scan();new MutationObserver(scan).observe(document.body,{subtree:true,childList:true,characterData:true})})();
    </script>
  </body>
</html>
