<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#8d4dff" />
    <meta name="description" content="ErrandGo — post any errand, find someone to help, and get things done anywhere." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='25' fill='%238d4dff'/%3E%3Ctext x='50' y='68' font-size='62' text-anchor='middle' fill='white' font-family='Arial' font-weight='800'%3EE%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./src/ui-polish.css" />
    <link rel="stylesheet" href="./errandgo-states.css" />
    <title>ErrandGo — Get Things Done. Anywhere.</title>
    <style>
      .loading { display: none !important; }

      /* No conversation = no composer. */
      .chatBox:not(:has(.bubble)) + .chatForm { display: none !important; }
      .chatBox:not(:has(.bubble)) {
        min-height: 330px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .chatBox:not(:has(.bubble)) .infoCard {
        width: 100%;
        margin: 0;
        background: #fbf9ff;
        border-color: #e8e0f5;
        border-radius: 20px;
        padding: 28px 20px;
        text-align: center;
      }
      .chatBox:not(:has(.bubble)) .infoCard svg {
        width: 38px;
        height: 38px;
        color: #8d4dff;
        margin-bottom: 8px;
      }
      .chatBox:not(:has(.bubble)) .infoCard p {
        margin: 7px 0 0;
        font-size: 11px;
        line-height: 1.5;
        color: #77717f;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      try {
        const old = JSON.parse(localStorage.getItem('eg_chat') || '[]');
        if (Array.isArray(old) && old.some(m => !m.conversation_id)) {
          localStorage.removeItem('eg_chat');
        }
      } catch (_) {
        localStorage.removeItem('eg_chat');
      }
    </script>
    <script src="./errandgo-states.js" defer></script>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
